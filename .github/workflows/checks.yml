name: PMO Hub checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Lessons Learned PostgreSQL integration tests
        run: npm run test:integration --workspace @pmo-hub/lessons-learned-api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @pmo-hub/hub
      - run: npm run test:e2e:lessons-learned --workspace @pmo-hub/hub
