server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location = /resource-allocation {
        return 308 /resource-allocation/;
    }

    location = /resource-allocation/ {
        rewrite ^ /index.html last;
    }

    location ^~ /resource-allocation/ {
        rewrite ^/resource-allocation/(.*)$ /$1 break;
        try_files $uri @resource_allocation;
    }

    location @resource_allocation {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        internal;
    }

    location / {
        return 404;
    }
}
