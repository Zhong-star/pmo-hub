server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    location = /lessons-learned {
        return 308 /lessons-learned/;
    }

    location = /lessons-learned/ {
        rewrite ^ /index.html last;
    }

    location ^~ /lessons-learned/ {
        rewrite ^/lessons-learned/(.*)$ /$1 break;
        try_files $uri @lessons_learned;
    }

    location @lessons_learned {
        rewrite ^ /index.html last;
    }

    location = /index.html {
        internal;
    }

    location / {
        return 404;
    }
}
