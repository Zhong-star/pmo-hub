services:
  lessons-learned-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lessons_learned}
      POSTGRES_USER: ${POSTGRES_USER:-lessons_learned}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessons_learned_dev}
    ports:
      - "127.0.0.1:${LESSONS_LEARNED_DB_PORT:-5433}:5432"
    volumes:
      - lessons-learned-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  lessons-learned-postgres-data:
